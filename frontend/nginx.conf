# upstream cho backend container (docker-compose service name = backend)
upstream backend_api {
    server backend:3000;
}

# HTTPS server
server {
    listen 80;
    server_name localhost;

    # CHỈ ĐỂ SIZE UPLOAD LỚN HƠN NẾU CẦN
    client_max_body_size 50M;

    # Static frontend (Vue SPA)
    root /usr/share/nginx/html;
    index index.html index.htm;

    # optional: cache static assets for a long time
    location ~* \.(?:css|js|jpg|jpeg|gif|png|svg|ico|woff2?|ttf|eot)$ {
        try_files $uri =404;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    location / {
        # SPA fallback cho Vue Router
        try_files $uri $uri/ /index.html;
    }

    # API proxy
    location /api/ {
        proxy_pass http://backend_api;   # dùng upstream phía trên
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header X-Forwarded-Server $hostname;
    }

    # Proxy uploads (ảnh từ backend)
    location /uploads/ {
        proxy_pass http://backend_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }
}
